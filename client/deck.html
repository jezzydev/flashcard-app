<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="./assets/images/favicon-32x32.png"
        />
        <link rel="stylesheet" href="./css/base.css" />
        <link rel="stylesheet" href="./css/components/button.css" />
        <link rel="stylesheet" href="./css/components/nav.css" />
        <link rel="stylesheet" href="./css/components/breadcrumb.css" />
        <link rel="stylesheet" href="./css/components/stats.css" />
        <link rel="stylesheet" href="./css/components/progressbar.css" />
        <link rel="stylesheet" href="./css/components/card.css" />
        <link rel="stylesheet" href="./css/components/form.css" />
        <link rel="stylesheet" href="./css/components/modal.css" />
        <link rel="stylesheet" href="./css/pages/deck.css" />

        <title>Frontend Mentor | Flashcard App - Deckname</title>
    </head>
    <body>
        <nav>
            <a href="dashboard.html">
                <img src="./assets/images/logo-large.svg" alt="Logo" />
            </a>
            <div class="Nav__right">
                <a class="Nav__btn" href="dashboard.html">Dashboard</a>
                <button class="Nav__btn Btn Logout">Log out</button>
            </div>
        </nav>
        <main>
            <div class="Page__loading">Loading...</div>

            <div class="Page__content" hidden>
                <!-- Breadcrumb -->
                <section class="Breadcrumb">
                    <a href="dashboard.html">My Decks</a>
                    <span class="Breadcrumb__arrow">></span>
                    <span class="Breadcrumb__text"></span>
                </section>
                <!-- Deck header -->
                <section class="Page__header">
                    <div class="DeckHeader__left">
                        <h1 class="DeckHeader__deckName"></h1>
                        <p class="DeckHeader__deckDesc"></p>
                    </div>
                    <a class="Btn Btn--primary Deck__studyBtn" href="study.html"
                        ><svg
                            width="15"
                            height="15"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2.5"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <polygon points="5 3 19 12 5 21 5 3"></polygon>
                        </svg>
                        Study Now</a
                    >
                </section>
                <!-- Stats -->
                <section class="Stats__container DeckStats">
                    <div class="Stats__card">
                        <p class="Stats__num DeckStats__totalCards"></p>
                        <p class="Stats__label">Total cards</p>
                    </div>
                    <div class="Stats__card">
                        <p class="Stats__num DeckStats__cardsDue"></p>
                        <p class="Stats__label">Due today</p>
                    </div>
                    <div class="Stats__card">
                        <p class="Stats__num DeckStats__retentionRate"></p>
                        <p class="Stats__label">Retention rate</p>
                        <p class="Stats__sub">ratings ≥ 3 / total</p>
                    </div>
                    <div class="Stats__card">
                        <p class="Stats__num DeckStats__dayStreak"></p>
                        <p class="Stats__label">Day streak</p>
                    </div>
                </section>

                <!-- Add card form -->
                <section class="AddCardSection">
                    <p class="AddCard__title">
                        <svg
                            width="16"
                            height="16"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2.5"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        Add a card
                    </p>
                    <form class="Form AddCardForm">
                        <div
                            class="Field__error"
                            id="add-card-form-error"
                        ></div>
                        <div class="Field">
                            <label for="add-card-front">Front (question)</label>
                            <div class="Field__inputWrap">
                                <input
                                    type="text"
                                    id="add-card-front"
                                    placeholder="e.g. What is a closure in JavaScript?"
                                />
                            </div>
                            <div
                                class="Field__error"
                                id="add-card-front-error"
                            ></div>
                        </div>
                        <div class="Field">
                            <label for="add-card-back">Back (answer)</label>
                            <div class="Field__inputWrap">
                                <textarea
                                    id="add-card-back"
                                    rows="3"
                                    placeholder="e.g., A function that retains access to variables from its outer scope."
                                ></textarea>
                            </div>
                            <div
                                class="Field__error"
                                id="add-card-back-error"
                            ></div>
                        </div>
                        <div class="AddCardForm__footer">
                            <button
                                class="Btn Btn--primary AddCard__btn"
                                type="submit"
                                id="add-card-submit-btn"
                                aria-label="Button to add card"
                            >
                                <svg
                                    width="14"
                                    height="14"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2.5"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                >
                                    <line x1="12" y1="5" x2="12" y2="19"></line>
                                    <line x1="5" y1="12" x2="19" y2="12"></line>
                                </svg>
                                Add card
                            </button>
                        </div>
                    </form>
                </section>

                <!-- Cards list -->
                <section class="CardsListSection">
                    <div class="CardsList__header">
                        <h2 class="Section__label">Your Cards</h2>
                        <p class="Cards__count"></p>
                    </div>
                    <ul class="CardsList"></ul>
                </section>
                <!-- End of Card list -->
            </div>

            <!-- Page Error -->
            <div class="Page__errorState" id="deck-page-error" hidden>
                <div class="PageError__icon">⚠️</div>
                <h2 class="PageError__title">Could not load this deck</h2>
                <p class="PageError__message"></p>
                <a href="dashboard.html">← Back to dashboard</a>
            </div>
        </main>

        <!-- Edit card modal -->
        <div class="Modal__overlay" id="edit-modal">
            <div class="Modal">
                <h3 class="Modal__title">Edit card</h3>
                <button
                    class="Modal__closeBtn"
                    type="button"
                    id="edit-card-close-btn"
                    aria-label="Button to close the modal"
                >
                    ✕
                </button>
                <form class="Form ModalForm EditCardForm">
                    <input type="hidden" id="edit-card-id" />
                    <div class="Field__error" id="edit-card-form-error"></div>
                    <div class="Field">
                        <label for="edit-card-front">Front (question)</label>
                        <div class="Field__inputWrap">
                            <input
                                type="text"
                                id="edit-card-front"
                                placeholder="e.g. What is a closure in JavaScript?"
                            />
                        </div>
                        <div
                            class="Field__error"
                            id="edit-card-front-error"
                        ></div>
                    </div>
                    <div class="Field">
                        <label for="edit-card-back">Back (answer)</label>
                        <div class="Field__inputWrap">
                            <textarea
                                id="edit-card-back"
                                rows="3"
                                placeholder="e.g., A function that retains access to variables from its outer scope."
                            ></textarea>
                        </div>
                        <div
                            class="Field__error"
                            id="edit-card-back-error"
                        ></div>
                    </div>
                    <div class="Modal__actions">
                        <button
                            class="Btn Btn--cancel"
                            type="button"
                            id="edit-card-cancel-btn"
                            aria-label="Cancel card update button"
                        >
                            Cancel
                        </button>
                        <button
                            class="Btn Btn--primary"
                            type="submit"
                            id="edit-card-submit-btn"
                            aria-label="Confirm card update button"
                        >
                            Update card
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Delete card modal -->
        <div class="Modal__overlay" id="delete-modal">
            <div class="Modal Modal--delete">
                <input type="hidden" id="delete-card-id" />
                <div class="Field__error" id="delete-card-error"></div>
                <h3 class="Modal__title">Delete this card?</h3>
                <button
                    class="Modal__closeBtn"
                    type="button"
                    id="delete-card-close-btn"
                    aria-label="Button to close the modal"
                >
                    ✕
                </button>
                <div class="Modal__actions">
                    <button
                        class="Btn Btn--cancel"
                        type="button"
                        id="delete-card-cancel-btn"
                        aria-label="Cancel card deletion button"
                    >
                        Cancel
                    </button>
                    <button
                        class="Btn Btn--delete"
                        type="button"
                        id="delete-card-conf-delete-btn"
                        aria-label="Confirm card deletion button"
                    >
                        Delete card
                    </button>
                </div>
            </div>
        </div>
        <script type="module" src="./js/pages/deck.js"></script>
    </body>
</html>
