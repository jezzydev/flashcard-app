        <!-- Card -->
        <div class="CardStack">
            <div class="Card">
                <div class="Card__badge">✦ SRS powered</div>
                <div class="Card__logo">
                    <img src="./assets/images/logo-large.svg" alt="Logo" />
                </div>
                <div class="Card__heading">
                    <h1>Welcome back 👋</h1>
                    <p>Log in to continue your study streak.</p>
                </div>
                <form class="Form LoginForm" method="post" novalidate>
                    <div class="Field">
                        <label for="login-email">Email address</label>
                        <div class="Field__inputWrap">
                            <input
                                type="email"
                                id="login-email"
                                placeholder="you@example.com"
                                autocomplete="email"
                                required
                            />
                        </div>
                        <div
                            class="Field__error"
                            id="login-email-error"
                            role="alert"
                        ></div>
                    </div>
                    <div class="Field">
                        <label for="login-password">Password</label>
                        <div class="Field__inputWrap">
                            <input
                                type="password"
                                id="login-password"
                                placeholder="••••••••"
                                autocomplete="current-password"
                                required
                            />
                            <button
                                class="TogglePassword"
                                type="button"
                                aria-label="Toggle password visibility"
                            >
                                <svg
                                    width="18"
                                    height="18"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                >
                                    <path
                                        d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"
                                    ></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                        <div
                            class="Field__error"
                            id="login-password-error"
                            role="alert"
                        ></div>
                    </div>
                    <div
                        class="Form__error"
                        id="login-form-error"
                        role="alert"
                    ></div>
                    <!-- <div class="ForgotPassword">
            <a href="#">Forgot password?</a>
          </div> -->
                    <button
                        class="Btn Btn--submit"
                        type="submit"
                        id="login-submit"
                    >
                        Log in
                    </button>
                    <div class="Divider"><span>or</span></div>
                    <div class="RegisterLink">
                        Don't have an account?
                        <a href="register.html">Create one</a>
                    </div>
                </form>
            </div>
        </div>
        <script type="module" src="./js/pages/login.js"></script>
