<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="./assets/images/favicon-32x32.png"
        />
        <link rel="stylesheet" href="./css/base.css" />
        <link rel="stylesheet" href="./css/components/button.css" />
        <link rel="stylesheet" href="./css/components/nav.css" />
        <link rel="stylesheet" href="./css/components/stats.css" />
        <link rel="stylesheet" href="./css/components/card.css" />
        <link rel="stylesheet" href="./css/components/form.css" />
        <link rel="stylesheet" href="./css/components/modal.css" />
        <link rel="stylesheet" href="./css/pages/dashboard.css" />

        <title>Frontend Mentor | Flashcard App - Dashboard</title>
    </head>
    <body>
        <nav>
            <a href="dashboard.html">
                <img src="./assets/images/logo-large.svg" alt="Logo" />
            </a>
            <div class="Nav__right">
                <button class="Nav__btn Btn Active">Dashboard</button>
                <button class="Nav__btn Btn Logout">Log out</button>
            </div>
        </nav>
        <main>
            <div class="Page__loading">Loading...</div>

            <div class="Page__content" hidden>
                <section class="Page__header">
                    <div>
                        <h1>My Decks</h1>
                        <p>
                            Welcome back,
                            <span class="Header__username">username</span>
                        </p>
                    </div>
                    <button class="Btn Btn--primary" id="add-deck-btn">
                        <svg
                            width="16"
                            height="16"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2.5"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        New Deck
                    </button>
                </section>
                <section class="Stats__container DashboardStats">
                    <div class="Stats__card">
                        <div class="Stats__icon Yellow">📚</div>
                        <div class="Stats__info">
                            <p
                                class="Stats__num DashboardStats__totalDecks"
                            ></p>
                            <p class="Stats__label">Total decks</p>
                        </div>
                    </div>
                    <div class="Stats__card">
                        <div class="Stats__icon Blue">⏰</div>
                        <div class="Stats__info">
                            <p class="Stats__num DashboardStats__cardsDue"></p>
                            <p class="Stats__label">Cards due today</p>
                        </div>
                    </div>
                    <div class="Stats__card">
                        <div class="Stats__icon Pink">🔥</div>
                        <div class="Stats__info">
                            <p class="Stats__num DashboardStats__dayStreak"></p>
                            <p class="Stats__label">Day streak</p>
                        </div>
                    </div>
                </section>

                <!-- Decks list -->
                <section class="CardsListSection">
                    <h2 class="Section__label">Your Decks</h2>
                    <ul class="CardsList DeckGrid">
                        <!-- Add new deck -->
                        <li class="CardItem DeckCard--addDeck">
                            <button
                                class="DeckCard__addDeckBtn"
                                type="button"
                                aria-label="Create new deck button"
                            >
                                <svg
                                    width="22"
                                    height="22"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                >
                                    <line x1="12" y1="5" x2="12" y2="19"></line>
                                    <line x1="5" y1="12" x2="19" y2="12"></line>
                                </svg>
                                Create new deck
                            </button>
                        </li>
                    </ul>
                </section>
            </div>

            <!-- Page Error -->
            <div class="Page__errorState" id="dashboard-page-error" hidden>
                <div class="PageError__icon">⚠️</div>
                <h2 class="PageError__title">Could not load the dashboard</h2>
                <p class="PageError__message"></p>
            </div>
        </main>

        <!-- New deck modal -->
        <div class="Modal__overlay" id="add-modal">
            <div class="Modal">
                <h3 class="Modal__title">Create new deck</h3>
                <button
                    class="Modal__closeBtn"
                    type="button"
                    aria-label="Button to close the modal"
                >
                    ✕
                </button>
                <form
                    class="Form ModalForm CreateDeckForm"
                    method="POST"
                    novalidate
                >
                    <div class="Field">
                        <label for="add-deck-name">Deck name</label>
                        <div class="Field__inputWrap">
                            <input
                                type="text"
                                id="add-deck-name"
                                placeholder="e.g. Japanese N3 Vocabulary"
                            />
                        </div>
                        <div
                            class="Field__error"
                            id="add-deck-name-error"
                        ></div>
                    </div>
                    <div class="Field">
                        <label for="add-deck-description"
                            >Description<span class="Optional"
                                >optional</span
                            ></label
                        >
                        <div class="Field__inputWrap">
                            <textarea
                                id="add-deck-description"
                                rows="3"
                                placeholder="What will you study in this deck?"
                            ></textarea>
                        </div>
                    </div>
                    <div class="Modal__actions">
                        <button
                            class="Btn Btn--cancel"
                            type="button"
                            id="add-deck-cancel-btn"
                        >
                            Cancel
                        </button>
                        <button
                            class="Btn Btn--submit"
                            type="submit"
                            id="add-deck-submit-btn"
                        >
                            Create deck
                        </button>
                    </div>
                </form>
            </div>
        </div>
        <!-- Edit deck modal -->
        <div class="Modal__overlay" id="edit-modal">
            <div class="Modal">
                <h3 class="Modal__title">Edit deck</h3>
                <button
                    class="Modal__closeBtn"
                    type="button"
                    aria-label="Button to close the modal"
                >
                    ✕
                </button>
                <form class="Form ModalForm EditDeckForm">
                    <input type="hidden" id="edit-deck-id" />
                    <div class="Field">
                        <label for="edit-deck-name">Deck name</label>
                        <div class="Field__inputWrap">
                            <input
                                type="text"
                                id="edit-deck-name"
                                placeholder="e.g. Japanese N3 Vocabulary"
                            />
                        </div>
                        <div
                            class="Field__error"
                            id="edit-deck-name-error"
                        ></div>
                    </div>
                    <div class="Field">
                        <label for="edit-deck-description"
                            >Description<span class="Optional"
                                >optional</span
                            ></label
                        >
                        <div class="Field__inputWrap">
                            <textarea
                                id="edit-deck-description"
                                rows="3"
                                placeholder="What will you study in this deck?"
                            ></textarea>
                        </div>
                    </div>
                    <div class="Modal__actions">
                        <button
                            class="Btn Btn--cancel"
                            type="button"
                            aria-label="Cancel deck update"
                        >
                            Cancel
                        </button>
                        <button
                            class="Btn Btn--submit"
                            type="submit"
                            id="edit-deck-submit-btn"
                        >
                            Update deck
                        </button>
                    </div>
                </form>
            </div>
        </div>
        <!-- Delete deck modal -->
        <div class="Modal__overlay" id="delete-modal">
            <div class="Modal Modal--delete">
                <input type="hidden" id="delete-deck-id" />
                <h3 class="Modal__title">Delete this deck?</h3>
                <div class="Field__error" id="delete-deck-error"></div>
                <button
                    class="Modal__closeBtn"
                    type="button"
                    aria-label="Button to close the modal"
                >
                    ✕
                </button>
                <p class="DeleteMsg"></p>
                <div class="Modal__actions">
                    <button
                        class="Btn Btn--cancel"
                        type="button"
                        aria-label="Cancel deck deletion"
                    >
                        Cancel
                    </button>
                    <button
                        class="Btn Btn--delete"
                        type="button"
                        id="confirm-delete-deck-btn"
                    >
                        Delete deck
                    </button>
                </div>
            </div>
        </div>
        <script type="module" src="./js/pages/dashboard.js"></script>
    </body>
</html>
